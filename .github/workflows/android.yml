# Compila el APK de Android con la versión publicada en gh-pages como copia sin conexión,
# y lo publica en https://nexodipa.github.io/atlas-encephali/AtlasEncephali.apk
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/android/**', '.github/workflows/android.yml', 'src/**', 'endo/**']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que gh-pages tenga la versión de este commit
        run: sleep 90
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - name: Copia sin conexión dentro del APK
        run: |
          mkdir -p app/android/app/src/main/assets/www
          cp -r site/index.html site/endocrino site/manifest.webmanifest site/icons app/android/app/src/main/assets/www/
          rm -f app/android/app/src/main/assets/www/icons/shot-*.png
          V=$(grep -o "const APPVER='[^']*'" site/index.html | head -1 | cut -d"'" -f2)
          echo "VERSION_NAME=$V" >> $GITHUB_ENV
          echo "VERSION_CODE=$(( ${GITHUB_RUN_NUMBER} + 100 ))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Clave de firma estable entre compilaciones
        uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: atlas-debug-keystore-v1 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compilar
        run: gradle -p app/android assembleRelease --no-daemon
      - name: Publicar en gh-pages
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk site/AtlasEncephali.apk
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AtlasEncephali.apk
          git commit -m "APK Android ${VERSION_NAME} (compilación ${GITHUB_RUN_NUMBER})" || exit 0
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        with: { name: AtlasEncephali-apk, path: app/android/app/build/outputs/apk/release/app-release.apk }
