<meta charset="utf-8">
<title>Atlas Encephali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: laboratorio de disección oscuro — escenario 3D a la izquierda, ficha de atlas a la derecha; en móvil, escenario arriba y ficha debajo. */
:root{
  --bg:#0a0f12; --bg-2:#10171c; --bg-3:#151f26; --line:#223039; --line-2:#2d3e49;
  --fg:#e3eaed; --muted:#8c9ea8; --faint:#5d6e78; --accent:#9fd8ff; --bone:#eee5d0;
  --neg:#5f8fe6; --pos:#e2685a; --warn:#e8c46a;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:600;font-size:19px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.modes{display:flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;margin-left:auto}
.modes button{background:none;border:0;border-right:1px solid var(--line);padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.modes button:last-child{border-right:0}
.modes button:hover{color:var(--fg);background:var(--bg-3)}
.modes button.on{background:var(--bone);color:var(--bg)}
.langbox{display:flex;align-items:center;gap:10px;font-size:12px}
.langbox select{background:var(--bg-2);border:1px solid var(--line-2);border-radius:3px;padding:5px 8px;font-size:12.5px}
#trStatus{font-family:var(--mono);font-size:10.5px;color:var(--faint);max-width:260px;line-height:1.3}
#trExport{font-size:11.5px}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] .modes{margin-left:0;margin-right:auto}
html[dir=rtl] .modes button{border-right:0;border-left:1px solid var(--line)}
html[dir=rtl] .modes button:last-child{border-left:0}
html[dir=rtl] .left{border-right:0;border-left:1px solid var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 45%,#15222b 0%,#0d1418 55%,var(--bg) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas.drag{cursor:grabbing}
.hud{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.6;pointer-events:none}
.hud .view{color:var(--muted)} .hud .view em{font-style:normal;color:var(--bone)}
.legendbar{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);pointer-events:none;display:grid;gap:4px}
.legendbar .bar{width:200px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--neg),#c9c4ba,var(--pos))}
.legendbar .ticks{display:flex;justify-content:space-between;width:200px}
.tip,.tag{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;will-change:transform}
.tip{font-size:12px;background:rgba(10,15,18,.9);border:1px solid var(--line-2);padding:3px 8px;border-radius:3px}
.tag{font-family:var(--display);font-size:15px;color:var(--bone);display:flex;align-items:center;gap:8px}
.tag::before{content:"";width:28px;height:1px;background:var(--bone);opacity:.6}
.tag small{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
#sliceBox{position:absolute;right:14px;bottom:12px;width:240px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:4px;padding:8px}
#sliceBox canvas{display:block;width:100%;height:auto;image-rendering:auto;cursor:crosshair;background:#000}
#sliceInfo{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;min-height:28px;line-height:1.4}
#sliceInfo b{color:var(--fg);font-family:var(--body);font-size:12px;font-weight:500}
@media (max-width:880px){#sliceBox{width:150px}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;padding:20px}
.clear{position:absolute;right:14px;top:12px;font-size:12px;padding:5px 10px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;cursor:pointer}
.clear:hover{border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-top:1px solid var(--line);background:var(--bg-2);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:4px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:var(--bg-3)}
.seg button.on{color:var(--bg);background:var(--bone)}
input[type=range]{width:100px;accent-color:var(--bone)}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
aside.panel{overflow-y:auto;min-height:0;min-width:0;background:var(--bg-2)}
.pin{padding-block:20px 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.crumbs{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button,.lnk{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.crumbs button{font-family:var(--mono);font-size:11px}
.crumbs button:hover,.lnk:hover{color:var(--accent)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
h2{font-family:var(--display);font-weight:500;font-size:29px;line-height:1.12;margin:0;text-wrap:balance}
.sub2{font-family:var(--display);font-style:italic;color:var(--muted);font-size:15.5px;margin:4px 0 16px}
.ba{font-family:var(--mono);font-size:11px;color:var(--bg);background:var(--accent);padding:1px 6px;border-radius:2px}
.lede{font-size:14.5px;margin:0 0 18px;max-width:62ch}
h3{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.panel p{margin:0 0 10px;max-width:62ch}
.panel ul{margin:0;padding-left:18px;display:grid;gap:7px}
.panel li::marker{color:var(--faint)}
dl.facts{display:grid;grid-template-columns:118px minmax(0,1fr);gap:9px 14px;margin:0}
dl.facts dt{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
dl.facts dd{margin:0;min-width:0}
@media (max-width:880px){dl.facts{grid-template-columns:1fr;gap:2px}dl.facts dd{margin-bottom:8px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;padding:5px 9px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--bone);background:var(--bone);color:var(--bg)}
.chip code{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.refs{margin:0;padding-left:20px;display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.refs li::marker{color:var(--faint);font-family:var(--mono);font-size:11px}
.refs i{color:var(--fg);font-style:normal}
.refs a{color:var(--accent);font-family:var(--mono);font-size:11px;text-decoration:none;margin-right:8px}
.refs a:hover{text-decoration:underline}
.lvl{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;border:1px solid var(--line-2);color:var(--muted);margin-left:2px}
.lvl.primera{border-color:var(--accent);color:var(--accent)}
.lvl.negativa{border-color:var(--pos);color:var(--pos)}
.note{margin-top:26px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
.note a{color:var(--muted)}
.grp{margin-top:20px}
.grp h3{margin-top:0;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-wrap:wrap;gap:2px 14px}
.list button{background:none;border:0;padding:3px 0;font-size:13px;color:var(--fg);cursor:pointer;text-align:left}
.list button:hover{color:var(--accent)}
.list button small{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:4px}
.dbars{display:grid;gap:5px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:10px;align-items:center;font-size:12.5px;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;width:100%}
.drow:hover .nm{color:var(--accent)}
.drow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .trk{position:relative;height:8px;background:var(--bg-3);border-radius:2px}
.drow .trk::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.drow .fill{position:absolute;top:0;bottom:0;border-radius:2px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 96px 92px;gap:10px;align-items:center;font-size:12.5px;padding:2px 0}
.arow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .trk{position:relative;height:6px;background:var(--bg-3);border-radius:2px}
.arow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--bone)}
.arow .v{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.drow .v{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
select{background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;padding:6px 8px;width:100%;font-size:13.5px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat div{background:var(--bg-3);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--faint)}
.warnbox{border-left:2px solid var(--warn);padding:6px 0 6px 12px;font-size:13px;color:var(--fg);margin:10px 0}
.rngrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.rngrow input{flex:1;width:auto}
.rngrow output{font-family:var(--mono);font-size:12px;color:var(--bone);min-width:56px;text-align:right}
@media (max-width:880px){
  html,body{height:auto}
  .app{height:auto;display:block}
  main{display:block}
  .left{border-right:0}
  #stage{height:58vh;min-height:340px;flex:none}
  aside.panel{overflow:visible;border-top:1px solid var(--line)}
  .modes{margin-left:0}
  .drow{grid-template-columns:minmax(0,1fr) 100px 46px}
  .legendbar .bar,.legendbar .ticks{width:150px}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b data-notr>Atlas Encephali</b><span>Módulo 01 · Encéfalo</span></div>
    <nav class="modes" id="modes" aria-label="Modo">
      <button data-m="anat" class="on">Anatomía</button><button data-m="path">Patología</button><button data-m="sim">Simulación</button><button data-m="drug">Fármacos</button><button data-m="study">Estudio</button>
    </nav>
    <div class="langbox"><span id="trStatus" role="status" hidden></span><button id="trExport" class="lnk" hidden>Exportar traducciones</button><select id="langSel" aria-label="Idioma" data-notr><option value="es">Español</option></select></div>
  </header>
  <main>
    <section class="left">
      <div id="stage" aria-label="Modelo 3D del encéfalo">
        <div class="loading" id="loading">Cargando superficies corticales y núcleos…</div>
        <div class="hud"><div class="view">Vista <em id="viewName">lateral izquierda</em></div><div>Arrastra para rotar · rueda o pellizco para acercar · toca una región</div></div>
        <div class="legendbar" id="legend" hidden><div id="legendTitle">d de Cohen (casos − controles)</div><div class="bar" id="legendBar"></div><div class="ticks" id="legendTicks"><span>−0,6</span><span>0</span><span>+0,6</span></div></div>
        <button class="clear" id="clearBtn" hidden>Quitar selección</button>
        <div id="sliceBox" hidden><canvas id="sliceCv" aria-label="Corte de resonancia"></canvas><div id="sliceInfo">Pasa el cursor por el corte</div></div>
        <div class="tip" id="tip" hidden></div>
        <div class="tag" id="tag" hidden></div>
      </div>
      <div class="toolbar">
        <div class="ctl"><span class="lab">Vista</span>
          <div class="seg" id="views"><button data-v="latL" class="on">Izq</button><button data-v="latR">Der</button><button data-v="ant">Ant</button><button data-v="post">Post</button><button data-v="sup">Sup</button><button data-v="inf">Inf</button></div></div>
        <div class="ctl"><span class="lab">Hemisferio</span>
          <div class="seg" id="hemi"><button data-h="both" class="on">Ambos</button><button data-h="lh">Izq</button><button data-h="rh">Der</button></div></div>
        <div class="ctl"><span class="lab">Mapa</span>
          <div class="seg" id="parc"><button data-p="lobe">Lóbulos</button><button data-p="dk" class="on">68 regiones</button><button data-p="gl">360 áreas</button></div></div>
        <div class="ctl"><label class="lab" for="infl">Inflar</label><input id="infl" type="range" min="0" max="100" value="0"></div>
        <div class="ctl"><label class="lab" for="explode">Separar</label><input id="explode" type="range" min="0" max="100" value="0"></div>
        <div class="ctl"><label class="lab" for="ghost">Corteza</label><input id="ghost" type="range" min="0" max="100" value="100"></div>
        <div class="ctl"><span class="lab">Corte</span>
          <div class="seg" id="slc"><button data-s="off" class="on">No</button><button data-s="ax">Axial</button><button data-s="co">Coronal</button><button data-s="sa">Sagital</button></div>
          <input id="sliceR" type="range" min="0" max="100" value="55" aria-label="Posición del corte">
          <select id="sliceOv" style="width:auto;padding:3px 6px;font-size:12px" aria-label="Superposición del corte"><option value="lab">Estructuras</option><option value="tr">Tractos</option><option value="t1">Solo T1</option></select>
          <label class="chk"><input type="checkbox" id="sliceFlip">Invertir</label></div>
        <div class="ctl" id="layers">
          <label class="chk"><input type="checkbox" data-l="deep" checked>Núcleos</label>
          <label class="chk"><input type="checkbox" data-l="vent" checked>Ventrículos</label>
          <label class="chk"><input type="checkbox" data-l="cb" checked>Cerebelo</label>
          <label class="chk"><input type="checkbox" data-l="stem" checked>Tronco</label>
          <label class="chk"><input type="checkbox" data-l="tracts">Tractos</label>
        </div>
      </div>
    </section>
    <aside class="panel" id="panel"><div class="pin" id="pin"></div></aside>
  </main>
</div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const pin=$('#pin'), panel=$('#panel');
const S={mode:'anat',parc:'dk',hemi:'both',infl:0,explode:0,ghost:1,layers:{deep:true,vent:true,cb:true,stem:true,tracts:false},trColor:'cls',nt:null,
  study:{semio:'neuro',si:null,tab:'cases',ci:0,state:'ask',reveal:[],wrong:null,fq:null,deck:'Todo',qi:0,qa:null,fdeck:'Regiones',fi:0,fshow:false},sel:null,hover:null,dis:'scz',pathTab:'psy',disease:'ad',stage:0,rare:'wilson',psy:'scz',org:'delirium',drug:'haloperidol',rec:'D2',dose:null,stroke:{art:'mca',side:'L',on:false},tumor:{loc:'lfront',R:0}};
const DKN = META.dk_names;               // 'L_bankssts'...
const dkBase = i => DKN[i].slice(2);
const dkSide = i => DKN[i][0];
const GLN = META.gl_names;               // índice 0..359 -> 'L_V1'
const glCode = g => GLN[g-1].slice(2);
const sideEs = s => s==='L'?'izquierdo':'derecho';
const fmtD = d => (d>0?'+':d<0?'−':'')+Math.abs(d).toFixed(2).replace('.',',');
function hexRGB(h){const n=parseInt(h.slice(1),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function hsl(h,s,l){const k=n=>(n+h*12)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return [f(0),f(8),f(4)];}
const NEG=hexRGB('#4f7fd9'), POS=hexRGB('#e0604f'), NEU=hexRGB('#c9c4ba'), SIMBASE=hexRGB('#bdb6aa'), INF=hexRGB('#6e1f2b'), EDEMA=hexRGB('#d9c46a');
function divColor(d){ if(d==null) return [0.42,0.44,0.46]; const t=Math.max(-1,Math.min(1,d/0.6)); return t<0?mix(NEU,NEG,-t):mix(NEU,POS,t); }
const DEEPKEY = k => k.replace(/^[LR]/,'').replace(/^dent[LR]$/,'dent');
const sideOfKey = k => k==='dentL'?'L':k==='dentR'?'R':(/^[LR][a-z]/.test(k)?k[0]:null);
const trBase = n => n.replace(/_[LR]$/,'');
const trSide = n => /_L$/.test(n)?'L':/_R$/.test(n)?'R':null;
const SUBKEY = {thal:'thal',caud:'caud',put:'put',pal:'pal',hippo:'hippo',amyg:'amyg',accumb:'accumb',vent:'LatVent'};

/* region colors per DK index */
const dkColor=[];
{ const byLobe={}; DKN.forEach((n,i)=>{const b=n.slice(2); const lb=DK[b]?DK[b].lobe:'frontal'; (byLobe[lb]=byLobe[lb]||[]).push(i);});
  for(const lb in byLobe){ const base=hexRGB(LOBES[lb].color); const arr=byLobe[lb].filter(i=>dkSide(i)==='L');
    arr.forEach((i,k)=>{ const t=arr.length>1?k/(arr.length-1):0.5; const c=mix(mix(base,[1,1,1],0.18),mix(base,[0.15,0.15,0.18],0.35),t); dkColor[i]=c; dkColor[DKN.indexOf('R_'+dkBase(i))]=c; }); } }
const glColor=g=>{ const host=META.gl_host[g]; const base=host!=null?hexRGB(LOBES[lobeOfDK(host)].color):[0.5,0.5,0.5]; const t=(((g%180)+1)*0.618034)%1; const c=t<0.5?mix(base,[1,1,1],(0.5-t)*0.85):mix(base,[0.12,0.13,0.16],(t-0.5)*0.95); return mix(c,hsl(t,0.5,0.55),0.18); };

/* ============ panel ============ */
const isSurf = s => s && (s.kind==='dk'||s.kind==='gl'||s.kind==='lobe');
function selTest(o,s){ if(s.kind==='dk') return i=>o.dk[i]===s.id; if(s.kind==='gl') return i=>o.gl[i]===s.id; if(s.kind==='lobe') return i=>o.h===s.h&&o.dk[i]!==255&&lobeOfDK(o.dk[i])===s.id; return ()=>false; }
function lobeOfDK(i){const d=DK[dkBase(i)]; return d?d.lobe:'frontal';}
function enigmaRows(subkey, isCtx){

function cypName(e){ return 'CYP'+e; }
function interact(a,b){
  const A=IX[a]||{}, B=IX[b]||{}, na=DRUGS[a].es, nb=DRUGS[b].es, out=[];
  const both=(f)=>f(A,B,na,nb)||f(B,A,nb,na);
  if(a===b) return [{s:'baja',t:'Es el mismo fármaco.'}];
  both((X,Y,nx,ny)=>{ if(X.ser==='mao'&&(Y.ser||Y.symp||Y.da==='ago'||b==='bupropion'||a==='bupropion')){ out.push({s:'alta',t:`${nx} es un IMAO irreversible: con serotoninérgicos puede causar síndrome serotoninérgico y con simpaticomiméticos o dopaminérgicos, crisis hipertensiva. Combinación contraindicada; respetar un lavado de 2 semanas (5 semanas tras la fluoxetina).`}); return true; } });
  if(typeof A.ser==='number'&&typeof B.ser==='number'&&A.ser+B.ser>=3) out.push({s:'moderada',t:'Dos fármacos serotoninérgicos: riesgo de síndrome serotoninérgico (temblor, mioclonías, hiperreflexia, hipertermia, agitación). Vigilar al iniciar o subir dosis.'});
  both((X,Y,nx,ny)=>{ if(X.ser==='maob'&&typeof Y.ser==='number'&&Y.ser>=2){ out.push({s:'moderada',t:`${nx} inhibe la MAO-B; con ${ny} el riesgo serotoninérgico es bajo a dosis habituales pero se recomienda vigilancia.`}); return true; } });
  if((A.acb||0)+(B.acb||0)>=3) out.push({s:'moderada',t:`Carga anticolinérgica acumulada (${(A.acb||0)+(B.acb||0)} puntos en una escala tipo ACB): estreñimiento, retención urinaria, visión borrosa y, en mayores, confusión, delirium y deterioro cognitivo.`});
  both((X,Y,nx,ny)=>{ if(X.chol&&(Y.acb||0)>=2){ out.push({s:'moderada',t:`${nx} aumenta la acetilcolina y ${ny} la bloquea: efectos opuestos que anulan el beneficio cognitivo.`}); return true; } });
  if(A.qt&&B.qt) out.push({s:'moderada',t:'Ambos prolongan el intervalo QT: hacer un ECG y corregir potasio y magnesio; mayor riesgo en mujeres, ancianos y cardiopatía.'});
  const resp=(X,Y)=>X.op&&(Y.op||(Y.cns||0)>=2);
  if(resp(A,B)||resp(B,A)) out.push({s:'alta',t:'Opioide con otro depresor del sistema nervioso central (benzodiacepinas, alcohol, gabapentinoides, otro opioide): riesgo de depresión respiratoria mortal. Es la combinación implicada en buena parte de las muertes por sobredosis.'});
  else if((A.cns||0)>=1&&(B.cns||0)>=1) out.push({s:(A.cns||0)+(B.cns||0)>=4?'moderada':'baja',t:'Sedación aditiva: somnolencia, caídas, alteración psicomotora (conducción).'});
  both((X,Y,nx,ny)=>{ if(X.opant&&(Y.op||Y.opp)){ out.push({s:'alta',t:`${nx} bloquea el receptor μ: en una persona que toma ${ny} precipita abstinencia y anula la analgesia.`}); return true; } });
  both((X,Y,nx,ny)=>{ if(X.opp&&Y.op){ out.push({s:'moderada',t:`${nx} es un agonista parcial de altísima afinidad: desplaza a ${ny} y puede precipitar abstinencia si se introduce con el agonista aún activo.`}); return true; } });
  both((X,Y,nx,ny)=>{ const inh=(X.cyp||{}).inh||{}; for(const e in inh) if(((Y.cyp||{}).sub||[]).includes(e)) out.push({s:inh[e]==='potente'?'moderada':'baja',t:`${nx} inhibe ${cypName(e)} (${inh[e]}): aumenta los niveles de ${ny}.`}); });
  both((X,Y,nx,ny)=>{ const ind=(X.cyp||{}).ind||[]; for(const e of ind) if(((Y.cyp||{}).sub||[]).includes(e)) out.push({s:'moderada',t:`${nx} induce ${cypName(e)}: reduce los niveles de ${ny}, con riesgo de pérdida de eficacia (y de toxicidad al retirar el inductor).`}); });
  both((X,Y,nx,ny)=>{ if((X.cyp||{}).inhLam&&Y.lam){ out.push({s:'alta',t:`${nx} inhibe la glucuronidación de ${ny} y duplica sus niveles: mayor riesgo de exantema grave (Stevens-Johnson). Usar la mitad de la dosis y una titulación más lenta.`}); return true; } });
  if(A.agr&&B.agr) out.push({s:'alta',t:'Ambos pueden causar agranulocitosis: combinación desaconsejada.'});
  both((X,Y,nx,ny)=>{ if(X.da==='ant'&&Y.da==='ago'){ out.push({s:'moderada',t:`Efectos opuestos sobre la dopamina: ${nx} bloquea lo que ${ny} estimula. Empeora el parkinsonismo o la psicosis según el caso.`}); return true; } });
  both((X,Y,nx,ny)=>{ if(X.da==='dep'&&Y.da==='ant'){ out.push({s:'moderada',t:`${nx} agota la dopamina y ${ny} la bloquea: riesgo aditivo de parkinsonismo.`}); return true; } });
  if(A.symp&&B.symp) out.push({s:'moderada',t:'Efectos simpaticomiméticos aditivos: taquicardia, hipertensión, insomnio, ansiedad.'});
  both((X,Y,nx,ny)=>{ if(X.li&&typeof Y.ser==='number'&&Y.ser>=2){ out.push({s:'baja',t:`Litio con ${ny}: combinación frecuente y útil; casos raros de síndrome serotoninérgico o neurotoxicidad.`}); return true; } });
  both((X,Y,nx,ny)=>{ if(X.seiz&&((Y.acb||0)>=3||Y.agr)){ out.push({s:'moderada',t:`${nx} baja el umbral convulsivo, y ${ny} también: precaución.`}); return true; } });
  return out;
}

const store={get(k,d){ try{ const v=localStorage.getItem('ae_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem('ae_'+k,JSON.stringify(v)); }catch(e){} }};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n,excl){ return shuffle(arr.filter(x=>!excl.includes(x))).slice(0,n); }
let QBANK=null;
function buildBank(){
  const b=QUIZ.map(x=>({...x,o:x.o.map(String)}));
  // farmacología: acción principal
  const dk=Object.keys(DRUGS), act=k=>{ const [t,[l,a]]=Object.entries(DRUGS[k].aff).sort((x,y)=>y[1][0]-x[1][0])[0]; return {t,txt:`${ACT[a][0].toUpperCase()+ACT[a].slice(1)} de ${TARGET[t].charAt(0).toLowerCase()+TARGET[t].slice(1)}`}; };
  for(const k of dk){ const a=act(k); const others=[...new Set(dk.filter(x=>act(x).t!==a.t).map(x=>act(x).txt))]; b.push({d:"Farmacología",q:`¿Cuál es la acción principal de ${DRUGS[k].es}?`,o:[a.txt,...pickN(others,3,[a.txt])],c:0,why:DRUGS[k].mech,go:'drug:'+k}); }
  // psicopatología: primera línea
  for(const p in TXLEVEL){ const first=Object.keys(TXLEVEL[p]).filter(d=>TXLEVEL[p][d]==='primera'); if(!first.length) continue; const ok=first[Math.floor(Math.random()*first.length)];
    const wrong=dk.filter(d=>!PSY[p].tx.includes(d)&&DRUGS[d].cls!==DRUGS[ok].cls&&!['Otros','Sustancias psicoactivas'].includes(DRUGS[d].cls));
    b.push({d:"Psicopatología",q:`¿Cuál de estos es un fármaco de primera línea en ${PSY[p].es.toLowerCase()}?`,o:[DRUGS[ok].es,...pickN(wrong,3,[]).map(d=>DRUGS[d].es)],c:0,why:`Según las guías citadas en la ficha de ${PSY[p].es}.`,go:'psy:'+p}); }
  // psicopatología: síntoma y circuito
  for(const p in PSY) for(const [sx,cx] of PSY[p].sx.slice(0,2)){ const oth=[].concat(...Object.keys(PSY).filter(x=>x!==p).map(x=>PSY[x].sx.map(y=>y[1]))); b.push({d:"Psicopatología",q:`${PSY[p].es}: ¿qué circuito o estructura se asocia a «${sx.toLowerCase()}»?`,o:[cx,...pickN([...new Set(oth)],3,[cx])],c:0,why:PSY[p].model.split('. ')[0]+'.',go:'psy:'+p}); }
  // organicidad
  const ok=Object.keys(ORG); for(const k of ok){ b.push({d:"Organicidad",q:`¿Qué causa orgánica encaja con esta presentación? «${ORG[k].psy.split('. ')[0]}.»`,o:[ORG[k].es,...pickN(ok,3,[k]).map(x=>ORG[x].es)],c:0,why:ORG[k].cause,go:'org:'+k}); }
  // neuroanatomía: función de región
  const rk=Object.keys(DK); for(const k of rk){ b.push({d:"Neuroanatomía",q:`¿Qué región corresponde a esta descripción? «${DK[k].fn.split('. ')[0]}.»`,o:[DK[k].es,...pickN(rk,3,[k]).map(x=>DK[x].es)],c:0,why:DK[k].clin,go:'dk:'+k}); }
  // neurodegenerativas y raras
  for(const k in DISEASE){ const n=DISEASE[k].stages[0]; b.push({d:"Neurología",q:`¿En qué enfermedad la afectación empieza por: «${n.es}»?`,o:[DISEASE[k].es,...pickN(Object.keys(DISEASE),3,[k]).map(x=>DISEASE[x].es)],c:0,why:n.txt,go:'ndg:'+k}); }
  for(const k in RARE){ b.push({d:"Neurología",q:`¿Qué enfermedad rara se asocia a ${RARE[k].gene.split(' · ')[0]}?`,o:[RARE[k].es,...pickN(Object.keys(RARE),3,[k]).map(x=>RARE[x].es)],c:0,why:RARE[k].txt.split('. ')[0]+'.',go:'rare:'+k}); }
  return b.map((x,i)=>({...x,id:i}));
}
function flashDeck(name){
  if(name==='Regiones') return Object.keys(DK).map(k=>({id:'dk:'+k,f:DK[k].es,sub:DK[k].ba+' · '+LOBES[DK[k].lobe].name,b:DK[k].fn,spec:['c:L_'+k,'c:R_'+k],go:'dk:'+k}));
  if(name==='Núcleos') return Object.keys(DEEP).filter(k=>!/^stem/.test(k)).map(k=>({id:'deep:'+k,f:DEEP[k].es,sub:DEEP[k].group,b:DEEP[k].fn,spec:k==='dent'?['d:dentL','d:dentR']:['v3','v4','chiasm'].includes(k)?['d:'+k]:k==='vent'?['d:Lvent','d:Rvent']:['d:L'+k,'d:R'+k],deep:true,go:'deep:'+(k==='vent'?'Lvent':['v3','v4','chiasm'].includes(k)?k:k==='dent'?'dentL':'L'+k)}));
  if(name==='Tractos'){ const seen=new Set(); return META.tracts.filter(n=>{const b=trBase(n); if(seen.has(b)||!TRACT[b]) return false; seen.add(b); return true;}).map(n=>{ const b=trBase(n); return {id:'tr:'+b,f:TRACT[b].es,sub:TRCLS[TRACT[b].cls].es,b:TRACT[b].fn,spec:META.tracts.filter(x=>trBase(x)===b).map(x=>'t:'+x),tracts:true,go:'tr:'+META.tracts.find(x=>trBase(x)===b)}; }); }
  if(name==='Fármacos') return Object.keys(DRUGS).map(k=>({id:'drug:'+k,f:DRUGS[k].es,sub:DRUGS[k].cls,b:DRUGS[k].mech,go:'drug:'+k}));
  if(name==='Psicopatología') return Object.keys(PSY).map(k=>({id:'psy:'+k,f:PSY[k].es,sub:'Modelo neurobiológico',b:PSY[k].model,go:'psy:'+k}));
  if(name==='Organicidad') return Object.keys(ORG).map(k=>({id:'org:'+k,f:ORG[k].es,sub:'Signos de alarma',b:ORG[k].flags.join(' · ')+'. '+ORG[k].cause,go:'org:'+k}));

  return [];
}

function studyTabs(){ return `<div class="seg" id="stabs" style="margin-bottom:18px">${[['cases','Casos clínicos'],['quiz','Preguntas'],['flash','Tarjetas'],['semio','Semiología']].map(([k,l])=>`<button data-stab="${k}" class="${S.study.tab===k?'on':''}">${l}</button>`).join('')}</div>`; }
function mcq(qobj,prefix,answered,chosen){
  return `<div class="chips" style="flex-direction:column;align-items:stretch">${qobj.order.map(i=>{ const isC=i===qobj.c, isCh=i===chosen; const st=answered?(isC?'border-color:var(--accent);color:var(--accent)':isCh?'border-color:var(--pos);color:var(--pos)':'opacity:.6'):''; return `<button class="chip" data-${prefix}="${i}" style="${st}" ${answered?'disabled':''}>${qobj.o[i]}</button>`; }).join('')}</div>`;
}
function renderStudy(){
  const st=S.study; let h=studyTabs();
  if(st.tab==='cases'){
    const C=CASES[st.ci], res=store.get('cases',{}), nok=Object.values(res).filter(v=>v==='ok').length;
    const areas=[...new Set(CASES.map(c=>c.area))];
    h+=`<p class="kicker">Casos clínicos · localización</p><h2>${C.es}</h2><p class="sub2">${C.area} · caso ${st.ci+1} de ${CASES.length} · resueltos ${nok}</p>
    <select id="caseSel" style="margin-bottom:14px">${areas.map(a=>`<optgroup label="${a}">${CASES.map((c,i)=>c.area===a?`<option value="${i}" ${i===st.ci?'selected':''}>${res[c.id]==='ok'?'✓ ':res[c.id]==='fail'?'✗ ':''}${c.es}</option>`:'').join('')}</optgroup>`).join('')}</select>
    <div class="warnbox" style="border-color:var(--bone);font-size:14px">${C.vig}</div>`;
    if(st.state==='ask') h+=`<p style="margin-top:12px"><b>¿Dónde está la lesión o la alteración?</b> Toca la estructura en el modelo. Los colores y los nombres están ocultos hasta que respondas; puedes rotar, acercar y usar los controles de corteza y hemisferio.</p><p><button class="lnk" id="caseGive">Mostrar la respuesta</button></p>`;
    else {
      h+=`<div class="warnbox" style="border-color:${st.ok?'var(--accent)':'var(--pos)'};margin-top:12px"><b>${st.ok?'Correcto.':st.picked?'No es la estructura principal.':'Respuesta mostrada.'}</b> ${st.picked?`Elegiste: ${st.picked}. `:''}En azul claro, la localización esperada${st.ok||!st.picked?'':'; en rojo, tu elección'}.</div>
      <h3>Explicación</h3><p>${C.exp}</p>`;
      if(C.fq){ if(!st.fq) st.fq={...C.fq,order:shuffle([0,1,2,3].slice(0,C.fq.o.length)),chosen:null};
        h+=`<h3>Pregunta de seguimiento</h3><p>${C.fq.q}</p>${mcq(st.fq,'fq',st.fq.chosen!=null,st.fq.chosen)}${st.fq.chosen!=null?`<p style="margin-top:10px;font-size:13px"><b>${st.fq.chosen===C.fq.c?'Correcto.':'Incorrecto.'}</b> ${C.fq.why}</p>`:''}`; }
      h+=`<p style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap"><button class="lnk" id="caseNext">Siguiente caso</button><button class="lnk" id="caseRetry">Repetir</button>${C.go?`<button class="lnk" data-go="${C.go}">Ver la ficha</button>`:''}</p>`;
      h+=refsHtml(C.refs||[]);
    }
    h+=`<p class="note">Casos ficticios construidos con fines docentes a partir de cuadros clásicos. La localización se evalúa sobre un cerebro promedio; en la clínica, la neuroimagen confirma la sospecha.</p>`;
    pin.innerHTML=h;
    $('#caseSel').onchange=e=>{ st.ci=+e.target.value; studyEnter(); };
    const g=$('#caseGive'); if(g) g.onclick=()=>studyPick(null,'');
    const nx=$('#caseNext'); if(nx) nx.onclick=()=>{ st.ci=(st.ci+1)%CASES.length; studyEnter(); };
    const rt=$('#caseRetry'); if(rt) rt.onclick=()=>studyEnter();
    pin.querySelectorAll('[data-fq]').forEach(b=>b.onclick=()=>{ st.fq.chosen=+b.dataset.fq; renderStudy(); });
  }
  if(st.tab==='quiz'){
    if(!QBANK) QBANK=buildBank();
    const decks=['Todo',...new Set(QBANK.map(q=>q.d))]; const pool=QBANK.filter(q=>st.deck==='Todo'||q.d===st.deck);
    if(!st.qa||st.qa.deck!==st.deck){ const q=pool[Math.floor(Math.random()*pool.length)]; st.qa={deck:st.deck,q,order:shuffle(q.o.map((_,i)=>i)),chosen:null}; }
    const sc=store.get('quiz',{n:0,ok:0}), Q=st.qa.q;
    h+=`<p class="kicker">Preguntas · ${QBANK.length} en el banco</p><h2>Autoevaluación</h2><p class="sub2">Respondidas ${sc.n} · aciertos ${sc.n?Math.round(100*sc.ok/sc.n):0}%</p>
    <div class="seg" id="qdeck" style="margin-bottom:16px">${decks.map(d=>`<button data-qd="${d}" class="${st.deck===d?'on':''}">${d}</button>`).join('')}</div>
    <p class="kicker">${Q.d}</p><p style="font-size:15px;margin-bottom:12px">${Q.q}</p>${mcq({o:Q.o,c:Q.c,order:st.qa.order},'qo',st.qa.chosen!=null,st.qa.chosen)}`;
    if(st.qa.chosen!=null) h+=`<div class="warnbox" style="border-color:${st.qa.chosen===Q.c?'var(--accent)':'var(--pos)'};margin-top:12px"><b>${st.qa.chosen===Q.c?'Correcto.':'Incorrecto.'}</b> ${Q.why||''}</div><p style="display:flex;gap:16px;flex-wrap:wrap"><button class="lnk" id="qNext">Siguiente pregunta</button>${Q.go?`<button class="lnk" data-go="${Q.go}">Ver la ficha</button>`:''}</p>`;
    h+=`<p class="note">Parte de las preguntas se generan a partir del contenido del atlas, así que repasan exactamente lo que explican sus fichas. El progreso se guarda solo en este navegador.</p>`;
    pin.innerHTML=h;
    pin.querySelectorAll('[data-qd]').forEach(b=>b.onclick=()=>{ st.deck=b.dataset.qd; st.qa=null; renderStudy(); });
    pin.querySelectorAll('[data-qo]').forEach(b=>b.onclick=()=>{ st.qa.chosen=+b.dataset.qo; const sc=store.get('quiz',{n:0,ok:0}); sc.n++; if(st.qa.chosen===Q.c) sc.ok++; store.set('quiz',sc); renderStudy(); });
    const qn=$('#qNext'); if(qn) qn.onclick=()=>{ st.qa=null; renderStudy(); };
  }
  if(st.tab==='flash'){
    const deck=flashDeck(st.fdeck), box=store.get('flash',{});
    if(!st.fcard||st.fcard.deck!==st.fdeck){ const minB=Math.min(...deck.map(c=>box[c.id]||0)); const cand=deck.filter(c=>(box[c.id]||0)===minB); st.fcard={deck:st.fdeck,c:cand[Math.floor(Math.random()*cand.length)]}; st.fshow=false; st.reveal=[]; recolor(); }
    const c=st.fcard.c, known=deck.filter(x=>(box[x.id]||0)>=2).length;
    h+=`<p class="kicker">Tarjetas · repetición espaciada</p><h2>Repaso</h2><p class="sub2">${st.fdeck}: ${known} de ${deck.length} dominadas</p>
    <div class="seg" id="fdeck" style="margin-bottom:16px">${FDECKS.map(d=>`<button data-fd="${d}" class="${st.fdeck===d?'on':''}">${d}</button>`).join('')}</div>
    <div style="border:1px solid var(--line-2);border-radius:4px;padding:22px 20px;background:var(--bg-3)"><p class="kicker">${c.sub||''}</p><h2 style="font-size:24px">${c.f}</h2>
    ${st.fshow?`<p style="margin-top:14px">${c.b}</p>${c.spec?'<p style="font-size:12px;color:var(--muted)">Resaltada en azul claro en el modelo.</p>':''}`:`<p style="margin-top:14px;color:var(--muted)">${c.spec?'¿Dónde está y qué hace?':'¿Qué sabes de esto?'} Piénsalo antes de girar la tarjeta.</p>`}</div>
    <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">${st.fshow?`<button class="chip" id="fAgain">Otra vez</button><button class="chip" id="fGood">La sabía</button><button class="lnk" data-go="${c.go}">Ver la ficha</button>`:`<button class="chip on" id="fShow">Girar la tarjeta</button>`}</p>
    <p class="note">Sistema de Leitner: las tarjetas que fallas vuelven antes; las que aciertas se espacian. El progreso se guarda en este navegador.</p>`;
    pin.innerHTML=h;
    pin.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{ st.fdeck=b.dataset.fd; st.fcard=null; renderStudy(); });
    const fs=$('#fShow'); if(fs) fs.onclick=()=>{ st.fshow=true; if(c.spec){ st.reveal=c.spec; studyView({v:'latL',ghost:c.deep?0.15:1,tracts:c.tracts}); } renderStudy(); };
    const nextCard=d=>{ const bx=store.get('flash',{}); bx[c.id]=d<0?0:Math.min(5,(bx[c.id]||0)+1); store.set('flash',bx); st.fcard=null; renderStudy(); };
    const fa=$('#fAgain'); if(fa) fa.onclick=()=>nextCard(-1); const fg=$('#fGood'); if(fg) fg.onclick=()=>nextCard(1);
  }
  if(st.tab==='semio'){
    const L=st.semio==='neuro'?SEMIO_NEURO:SEMIO_PSY, grps=[...new Set(L.map(x=>x.g))], it=st.si!=null?L[st.si]:null;
    h+=`<p class="kicker">Semiología</p><h2>${st.semio==='neuro'?'Exploración neurológica':'Psicopatología descriptiva'}</h2><p class="sub2">${st.semio==='neuro'?'Qué se explora, qué se encuentra y dónde está la lesión':'Fenomenología y examen del estado mental'}</p>
    <div class="seg" style="margin-bottom:16px"><button data-sm="neuro" class="${st.semio==='neuro'?'on':''}">Neurológica</button><button data-sm="psy" class="${st.semio==='psy'?'on':''}">Psiquiátrica</button></div>`;
    if(it){ h+=`<p style="margin-bottom:12px"><button class="lnk" id="semBack">← Volver a la lista</button></p><p class="kicker">${it.g}</p><h2 style="font-size:24px">${it.es}</h2><p class="sub2">&nbsp;</p>`;
      if(st.semio==='neuro') h+=`<h3>Cómo se explora</h3><p>${it.how}</p><h3>Hallazgos</h3><p>${it.find}</p><h3>Localización</h3><p>${it.loc}</p>${it.spec?'<p style="font-size:12px;color:var(--muted)">Estructuras resaltadas en azul claro en el modelo.</p>':''}`;
      else h+=`<p>${it.txt}</p>${it.spec?'<p style="font-size:12px;color:var(--muted)">Estructuras relacionadas resaltadas en el modelo.</p>':''}`;
      const nxt=(st.si+1)%L.length; h+=`<p style="margin-top:14px"><button class="lnk" data-si="${nxt}">Siguiente: ${L[nxt].es}</button></p>`; }
    else h+=grps.map(g=>`<div class="grp"><h3>${g}</h3><div class="list">${L.map((x,i)=>x.g===g?`<button data-si="${i}">${x.es}</button>`:'').join('')}</div></div>`).join('');
    h+=`<p class="note">${st.semio==='neuro'?'Resumen docente de la exploración neurológica clásica orientado a la localización. La exploración completa requiere práctica supervisada.':'Terminología clásica de la psicopatología descriptiva (Jaspers, Schneider, Sims). Los criterios diagnósticos formales del DSM-5-TR y la CIE-11 deben consultarse en las fuentes originales.'}</p>`;
    pin.innerHTML=h;
    pin.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{ st.semio=b.dataset.sm; st.si=null; st.reveal=[]; recolor(); renderStudy(); });
    pin.querySelectorAll('[data-si]').forEach(b=>b.onclick=()=>{ st.si=+b.dataset.si; const x=L[st.si]; st.reveal=x.spec||[]; const deep=(x.spec||[]).some(p=>/^(d|s):/.test(p)); studyView({v:'latL',ghost:deep||x.tracts?0.18:1,tracts:!!x.tracts}); renderStudy(); });
    const sb=$('#semBack'); if(sb) sb.onclick=()=>{ st.si=null; st.reveal=[]; recolor(); renderStudy(); };
  }
  pin.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{ st.tab=b.dataset.stab; studyEnter(); });
  panel.scrollTop=0;
}

async function loadBuffer(){
  const b64=document.getElementById('atlasdata').textContent.trim(); const bin=atob(b64);
  let u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    if('DecompressionStream' in window){ const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); u8=new Uint8Array(await new Response(s).arrayBuffer()); }
    else { await new Promise((res,rej)=>{const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);}); u8=window.pako.ungzip(u8); }
  }
  return u8.buffer.slice(u8.byteOffset,u8.byteOffset+u8.byteLength);
}

async function init3D(){
const BUF=await loadBuffer();
const T={int16:Int16Array,uint16:Uint16Array,uint8:Uint8Array,int8:Int8Array};
function A(name){const [o,dt,sh]=META.index[name]; const n=sh.reduce((a,b)=>a*b,1); return new T[dt](BUF,o,n);}
function F(name){const a=A(name), f=new Float32Array(a.length); for(let i=0;i<a.length;i++) f[i]=a[i]/100; return f;}

const stage=$('#stage');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(30,1,1,4000); scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdde8ff,0x231a12,0.62));
const key=new THREE.DirectionalLight(0xfff6ea,0.85); key.position.set(-250,300,400); camera.add(key);
const rim=new THREE.DirectionalLight(0x9fd8ff,0.35); rim.position.set(300,150,-400); camera.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.25); fill.position.set(200,-100,300); camera.add(fill);
const root=new THREE.Group(); scene.add(root);

function mkMat(color,vc){return new THREE.MeshStandardMaterial({color:new THREE.Color(color||'#ffffff'),vertexColors:!!vc,roughness:0.66,metalness:0,side:THREE.DoubleSide,transparent:true,opacity:1});}
const objs=[]; // {mesh,kind,base(Float32),offsetDir,layer,...}

/* corteza */
const CTX={};
for(const h of ['lh','rh']){
  const pial=F(`ctx_${h}_pos`), infl=F(`ctx_${h}_infl`), idx=A(`ctx_${h}_idx`);
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(pial); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pial.length),3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1)); g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,mkMat('#ffffff',true)); root.add(mesh);
  const o={mesh,kind:'ctx',h,pial,infl,cur:new Float32Array(pial),dk:A(`ctx_${h}_dk`),gl:A(`ctx_${h}_gl`),sulc:A(`ctx_${h}_sulc`),off:new THREE.Vector3(),dir:new THREE.Vector3(h==='lh'?-1:1,0,0),mag:38,layer:'ctx',op:1};
  o.rec={}; for(const r in META.receptors) o.rec[r]=A(`rec_${r}_${h}`);
  mesh.userData.o=o; CTX[h]=o; objs.push(o);
}
/* profundas */
const DEEPO={};
for(const key of META.deep){
  const pos=F(`deep_${key}_pos`), idx=A(`deep_${key}_idx`);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3)); g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1)); g.computeVertexNormals();
  const base=DEEPKEY(key)==='stem'?'stem0':DEEPKEY(key);
  let vc=false; if(key==='stem'){ vc=true; g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pos.length),3)); }
  const mesh=new THREE.Mesh(g,mkMat(key==='stem'?'#ffffff':DEEP[base].color,vc)); root.add(mesh);
  const side=key[0]==='L'||key==='dentL'?-1:key[0]==='R'||key==='dentR'?1:0;
  const layer=key==='stem'?'stem':(/vent|^v[34]$/.test(key)?'vent':(/dent/.test(key)?'cb':'deep'));
  const dir=layer==='stem'?new THREE.Vector3(0,-1,0):layer==='cb'?new THREE.Vector3(0,-0.5,-1).normalize():new THREE.Vector3(side,0,0);
  const mag=layer==='stem'?40:layer==='cb'?38:12;
  const o={mesh,kind:key==='stem'?'stem':'deep',key,base:new Float32Array(pos),off:new THREE.Vector3(),dir,mag,layer,op:1,side};
  if(key==='stem') o.lab=A('deep_stem_lab');
  { const c=new THREE.Vector3(); for(let i=0;i<pos.length;i+=3){c.x+=pos[i];c.y+=pos[i+1];c.z+=pos[i+2];} o.cen=c.multiplyScalar(3/pos.length); o.sc=1; }
  mesh.userData.o=o; DEEPO[key]=o; objs.push(o);
}
/* cerebelo */
let CBO;{
  const pos=F('cb_pos'), idx=A('cb_idx'), lab=A('cb_lab');
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3)); g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1)); g.computeVertexNormals();
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pos.length),3));
  const mesh=new THREE.Mesh(g,mkMat('#ffffff',true)); root.add(mesh);
  const grp=Array.from(lab,l=>l>0?cbGroup(META.cb_names[l-1]):'ant');
  CBO={mesh,kind:'cb',base:new Float32Array(pos),grp,off:new THREE.Vector3(),dir:new THREE.Vector3(0,-0.5,-1).normalize(),mag:38,layer:'cb',op:1};
  mesh.userData.o=CBO; objs.push(CBO);
}
/* tractos */
let TRO;{
  const pos=F('tr_pos'), idx=A('tr_idx'), tid=A('tr_id');
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3)); g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1)); g.computeVertexNormals();
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pos.length),3));
  const mesh=new THREE.Mesh(g,mkMat('#ffffff',true)); mesh.material.roughness=0.45; root.add(mesh);
  // dirección principal de cada tracto (PCA) para el color DTI
  const n=META.tracts.length, dti=[];

  if(h.kind==='lobe') return LOBES[h.id].name+' · '+(h.h==='lh'?'izq':'der');
  if(h.kind==='gl') return glCode(h.id)+' · '+(GLN[h.id-1][0]==='L'?'izq':'der'); if(h.kind==='deep'){const b=DEEPKEY(h.key); const sk=SUBKEY[b]; const v=S.mode==='path'&&sk?META.disorders[S.dis].sub[h.key[0]+sk]:null; return DEEP[b].es+(v?'  d '+fmtD(v[0]):'');}
  if(h.kind==='stem') return DEEP['stem'+h.id].es; if(h.kind==='cb') return 'Cerebelo · '+CB[h.id].es; if(h.kind==='tr'){ const n=META.tracts[h.id], b=trBase(n), sd=trSide(n); return ((TRACT[b]||{es:b}).es)+(sd?' · '+(sd==='L'?'izq':'der'):''); } if(h.kind==='nt') return NT[h.id].es; return ''; }
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); idle=false; moved=false; drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0>0) cam.dist=camT.dist=Math.max(220,Math.min(1000,cam.dist*pinch0/d)); pinch0=d; moved=true; return;}
  if(drag&&ptrs.size===1){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5){moved=true; cv.classList.add('drag');}
    if(moved){cam.yaw-=dx*0.008; cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch+dy*0.008)); camT.yaw=cam.yaw; camT.pitch=cam.pitch;} $('#tip').hidden=true; return; }
  if(e.pointerType==='mouse'){ const h=pick(e.clientX,e.clientY); S.hover=h; const tip=$('#tip');
    if(h&&S.mode==='study'&&S.study.tab==='cases'&&S.study.state==='ask'){ tip.hidden=true; cv.style.cursor='crosshair'; }
    else if(h){const rc=stage.getBoundingClientRect(); tip.hidden=false; tip.textContent=nameOf(h); tip.style.transform=`translate(${e.clientX-rc.left+14}px,${e.clientY-rc.top+14}px)`; cv.style.cursor='pointer';} else {tip.hidden=true; cv.style.cursor='';} }
});
cv.addEventListener('pointerup',e=>{ const was=moved, single=ptrs.size===1; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=0; cv.classList.remove('drag');
  if(single&&!was&&drag){ const h=pick(e.clientX,e.clientY); if(h){ if(S.mode==='study'){ studyPick(h,nameOf(h)); } else { if(S.mode==='sim') setMode('anat'); select(h);} } } if(!ptrs.size) drag=null; });
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); drag=null;});
cv.addEventListener('pointerleave',()=>{$('#tip').hidden=true; S.hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault(); idle=false; camT.dist=Math.max(220,Math.min(1000,camT.dist*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});

function resize(){const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();

/* ============ bucle ============ */
function orientName(){ const p=cam.pitch; if(p>0.95) return 'superior'; if(p<-0.95) return 'inferior';
  const y=Math.atan2(Math.sin(cam.yaw),Math.cos(cam.yaw)), a=Math.abs(y), side=y<0?'izquierda':'derecha';
  if(S.hemi!=='both'&&a>0.6&&a<2.5){ const facing=y<0?'lh':'rh'; return (facing===S.hemi?'lateral ':'medial ')+(S.hemi==='lh'?'izquierda':'derecha'); }
  if(a<0.35) return 'anterior'; if(a>2.8) return 'posterior'; if(a<1.2) return 'anterolateral '+side; if(a<1.95) return 'lateral '+side; return 'posterolateral '+side; }
const tmp=new THREE.Vector3(), clock=new THREE.Clock(); let lastName='';
const tag=$('#tag');
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), k=1-Math.pow(0.002,dt);
  if(idle) camT.yaw+=dt*0.1;
  let dy=camT.yaw-cam.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); cam.yaw+=dy*k; cam.pitch+=(camT.pitch-cam.pitch)*k; cam.dist+=(camT.dist-cam.dist)*k;
  camera.position.set(cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw), cam.dist*Math.sin(cam.pitch), cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw)); camera.lookAt(0,0,0);
  const targets=selTargets();
  for(const o of objs){
    let vis=o.layer==='ctx'?(S.hemi==='both'||S.hemi===o.h):S.layers[o.layer];
    if(o.layer==='deep'||o.layer==='vent'){ if(S.hemi!=='both'&&o.side&&((o.side<0)!==(S.hemi==='lh'))) vis=false; }
    o.mesh.visible=vis;
    if(o.cen){ let tsc=1; if(COND&&S.mode==='path'){ const b=o.key.replace(/^[LR]/,''); if(COND.shrink[b]) tsc=COND.shrink[b]; if(o.layer==='vent') tsc=COND.vent||1; } o.sc+=(tsc-o.sc)*k; o.mesh.scale.setScalar(o.sc); }
    const pop=targets.includes(o)&&o.kind==='deep'?6:0;
    tmp.copy(o.dir).multiplyScalar(o.mag*S.explode+pop); o.off.lerp(tmp,k); o.mesh.position.copy(o.off); if(o.cen&&o.sc!==1) o.mesh.position.addScaledVector(o.cen,1-o.sc);
    let op=o.layer==='ctx'?S.ghost:1;
    if(targets.length&&!targets.includes(o)) op=o.layer==='ctx'?Math.min(op,0.12):0.25;
    if(o.layer==='ctx'&&S.mode==='sim'&&S.tumor.R>0.5) op=Math.min(op,0.55);
    if(o===TRO&&(S.sel&&S.sel.kind==='tr'||COND)) op=0.08;
    if(o===TRO&&S.nt) op=0.15;
    if(S.nt&&o.layer!=='ctx'&&o!==TRO) op=Math.min(op,0.4);
    o.op+=(op-o.op)*k; const m=o.mesh.material;
    if(o.layer==='ctx'){ const sd=o.op<0.97?THREE.FrontSide:THREE.DoubleSide; if(m.side!==sd){ m.side=sd; m.needsUpdate=true; } } m.opacity=o.op; m.depthWrite=o.layer==='ctx'?true:o.op>0.6; o.mesh.renderOrder=o.op>0.6?0:2;
    m.emissive.setRGB(0,0,0); if(targets.includes(o)&&o!==TRO) m.emissive.setRGB(0.12,0.12,0.12);
    if(S.hover&&!S.sel&&((S.hover.kind==='deep'&&o.key===S.hover.key))) m.emissive.setRGB(0.08,0.08,0.08);
  }
  if(ovState.h){ const o=CTX[ovState.h]; ovState.amt+=(ovState.target-ovState.amt)*k; overlay.position.copy(o.off).addScaledVector(ovState.dir,ovState.amt); overlay.visible=o.mesh.visible; }
  trHL.visible=trHL.visible&&TRO.mesh.visible&&!!(S.sel&&S.sel.kind==='tr'||COND);
  if(ntFlows.length) tickNT(clock.elapsedTime);
  renderer.render(scene,camera);
  // etiqueta
  if(S.sel){ let w=null; const s=S.sel;
    if(isSurf(s)){ const o=CTX[ovState.h]; const p=o.mesh.geometry.attributes.position.array; let bi=-1,bd=-1e9; const test=selTest(o,s);
      for(let i=0;i<o.dk.length;i+=3) if(test(i)){ tmp.set(p[i*3],p[i*3+1],p[i*3+2]); const d=tmp.dot(ovState.dir); if(d>bd){bd=d;bi=i;} }
      if(bi>=0){ w=new THREE.Vector3(p[bi*3],p[bi*3+1],p[bi*3+2]).add(overlay.position); } }
    else { const o=targets[0]; if(o&&o.mesh.visible){ o.mesh.geometry.computeBoundingSphere(); w=o.mesh.geometry.boundingSphere.center.clone().add(o.mesh.position); } }
    if(w){ root.localToWorld(w); w.project(camera); const rc=stage.getBoundingClientRect(); const x=(w.x*0.5+0.5)*rc.width, y=(-w.y*0.5+0.5)*rc.height;
      if(w.z<1){ tag.hidden=false; const nm=nameOf(s).split('  ')[0]; tag.innerHTML=nm.replace(' · ',' <small>')+(nm.includes(' · ')?'</small>':''); tag.style.transform=`translate(${Math.max(4,Math.min(x+8,rc.width-240))}px,${y-10}px)`; } else tag.hidden=true;
    } else tag.hidden=true; } else tag.hidden=true;
  const n=orientName(); if(n!==lastName){$('#viewName').textContent=n; lastName=n;}
  requestAnimationFrame(frame);
}
rebuildCtx(); recolor(); $('#loading').remove(); requestAnimationFrame(frame);
}
