<meta charset="utf-8">
<title>Atlas Encephali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: laboratorio de disección oscuro — escenario 3D a la izquierda, ficha de atlas a la derecha; en móvil, escenario arriba y ficha debajo. */
:root{
  --bg:#0a0f12; --bg-2:#10171c; --bg-3:#151f26; --line:#223039; --line-2:#2d3e49;
  --fg:#e3eaed; --muted:#8c9ea8; --faint:#5d6e78; --accent:#9fd8ff; --bone:#eee5d0;
  --neg:#5f8fe6; --pos:#e2685a; --warn:#e8c46a;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:600;font-size:19px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.modes{display:flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;margin-left:auto}
.modes button{background:none;border:0;border-right:1px solid var(--line);padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.modes button:last-child{border-right:0}
.modes button:hover{color:var(--fg);background:var(--bg-3)}
.modes button.on{background:var(--bone);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 45%,#15222b 0%,#0d1418 55%,var(--bg) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas.drag{cursor:grabbing}
.hud{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.6;pointer-events:none}
.hud .view{color:var(--muted)} .hud .view em{font-style:normal;color:var(--bone)}
.legendbar{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);pointer-events:none;display:grid;gap:4px}
.legendbar .bar{width:200px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--neg),#c9c4ba,var(--pos))}
.legendbar .ticks{display:flex;justify-content:space-between;width:200px}
.tip,.tag{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;will-change:transform}
.tip{font-size:12px;background:rgba(10,15,18,.9);border:1px solid var(--line-2);padding:3px 8px;border-radius:3px}
.tag{font-family:var(--display);font-size:15px;color:var(--bone);display:flex;align-items:center;gap:8px}
.tag::before{content:"";width:28px;height:1px;background:var(--bone);opacity:.6}
.tag small{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;padding:20px}
.clear{position:absolute;right:14px;top:12px;font-size:12px;padding:5px 10px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;cursor:pointer}
.clear:hover{border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-top:1px solid var(--line);background:var(--bg-2);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:4px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:var(--bg-3)}
.seg button.on{color:var(--bg);background:var(--bone)}
input[type=range]{width:100px;accent-color:var(--bone)}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
aside.panel{overflow-y:auto;min-height:0;min-width:0;background:var(--bg-2)}
.pin{padding-block:20px 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.crumbs{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button,.lnk{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.crumbs button{font-family:var(--mono);font-size:11px}
.crumbs button:hover,.lnk:hover{color:var(--accent)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
h2{font-family:var(--display);font-weight:500;font-size:29px;line-height:1.12;margin:0;text-wrap:balance}
.sub2{font-family:var(--display);font-style:italic;color:var(--muted);font-size:15.5px;margin:4px 0 16px}
.ba{font-family:var(--mono);font-size:11px;color:var(--bg);background:var(--accent);padding:1px 6px;border-radius:2px}
.lede{font-size:14.5px;margin:0 0 18px;max-width:62ch}
h3{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.panel p{margin:0 0 10px;max-width:62ch}
.panel ul{margin:0;padding-left:18px;display:grid;gap:7px}
.panel li::marker{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;padding:5px 9px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--bone);background:var(--bone);color:var(--bg)}
.chip code{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.note{margin-top:26px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
.note a{color:var(--muted)}
.grp{margin-top:20px}
.grp h3{margin-top:0;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-wrap:wrap;gap:2px 14px}
.list button{background:none;border:0;padding:3px 0;font-size:13px;color:var(--fg);cursor:pointer;text-align:left}
.list button:hover{color:var(--accent)}
.list button small{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:4px}
.dbars{display:grid;gap:5px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:10px;align-items:center;font-size:12.5px;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;width:100%}
.drow:hover .nm{color:var(--accent)}
.drow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .trk{position:relative;height:8px;background:var(--bg-3);border-radius:2px}
.drow .trk::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.drow .fill{position:absolute;top:0;bottom:0;border-radius:2px}
.drow .v{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
select{background:var(--bg-3);border:1px solid var(--line-2);border-radius:3px;padding:6px 8px;width:100%;font-size:13.5px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat div{background:var(--bg-3);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--faint)}
.warnbox{border-left:2px solid var(--warn);padding:6px 0 6px 12px;font-size:13px;color:var(--fg);margin:10px 0}
.rngrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.rngrow input{flex:1;width:auto}
.rngrow output{font-family:var(--mono);font-size:12px;color:var(--bone);min-width:56px;text-align:right}
@media (max-width:880px){
  html,body{height:auto}
  .app{height:auto;display:block}
  main{display:block}
  .left{border-right:0}
  #stage{height:58vh;min-height:340px;flex:none}
  aside.panel{overflow:visible;border-top:1px solid var(--line)}
  .modes{margin-left:0}
  .drow{grid-template-columns:minmax(0,1fr) 100px 46px}
  .legendbar .bar,.legendbar .ticks{width:150px}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Atlas Encephali</b><span>Módulo 01 · Encéfalo</span></div>
    <nav class="modes" id="modes" aria-label="Modo">
      <button data-m="anat" class="on">Anatomía</button><button data-m="path">Patología</button><button data-m="sim">Simulación</button><button data-m="drug">Fármacos</button>
    </nav>
  </header>
  <main>
    <section class="left">
      <div id="stage" aria-label="Modelo 3D del encéfalo">
        <div class="loading" id="loading">Cargando superficies corticales y núcleos…</div>
        <div class="hud"><div class="view">Vista <em id="viewName">lateral izquierda</em></div><div>Arrastra para rotar · rueda o pellizco para acercar · toca una región</div></div>
        <div class="legendbar" id="legend" hidden><div id="legendTitle">d de Cohen (casos − controles)</div><div class="bar" id="legendBar"></div><div class="ticks" id="legendTicks"><span>−0,6</span><span>0</span><span>+0,6</span></div></div>
        <button class="clear" id="clearBtn" hidden>Quitar selección</button>
        <div class="tip" id="tip" hidden></div>
        <div class="tag" id="tag" hidden></div>
      </div>
      <div class="toolbar">
        <div class="ctl"><span class="lab">Vista</span>
          <div class="seg" id="views"><button data-v="latL" class="on">Izq</button><button data-v="latR">Der</button><button data-v="ant">Ant</button><button data-v="post">Post</button><button data-v="sup">Sup</button><button data-v="inf">Inf</button></div></div>
        <div class="ctl"><span class="lab">Hemisferio</span>
          <div class="seg" id="hemi"><button data-h="both" class="on">Ambos</button><button data-h="lh">Izq</button><button data-h="rh">Der</button></div></div>
        <div class="ctl"><span class="lab">Mapa</span>
          <div class="seg" id="parc"><button data-p="lobe">Lóbulos</button><button data-p="dk" class="on">68 regiones</button><button data-p="gl">360 áreas</button></div></div>
        <div class="ctl"><label class="lab" for="infl">Inflar</label><input id="infl" type="range" min="0" max="100" value="0"></div>
        <div class="ctl"><label class="lab" for="explode">Separar</label><input id="explode" type="range" min="0" max="100" value="0"></div>
        <div class="ctl"><label class="lab" for="ghost">Corteza</label><input id="ghost" type="range" min="0" max="100" value="100"></div>
        <div class="ctl" id="layers">
          <label class="chk"><input type="checkbox" data-l="deep" checked>Núcleos</label>
          <label class="chk"><input type="checkbox" data-l="vent" checked>Ventrículos</label>
          <label class="chk"><input type="checkbox" data-l="cb" checked>Cerebelo</label>
          <label class="chk"><input type="checkbox" data-l="stem" checked>Tronco</label>
          <label class="chk"><input type="checkbox" data-l="tracts">Tractos</label>
        </div>
      </div>
    </section>
    <aside class="panel" id="panel"><div class="pin" id="pin"></div></aside>
  </main>
</div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const pin=$('#pin'), panel=$('#panel');
const S={mode:'anat',parc:'dk',hemi:'both',infl:0,explode:0,ghost:1,layers:{deep:true,vent:true,cb:true,stem:true,tracts:false},trColor:'cls',nt:null,
  sel:null,hover:null,dis:'scz',pathTab:'enigma',disease:'ad',stage:0,rare:'wilson',drug:'haloperidol',rec:'D2',stroke:{art:'mca',side:'L',on:false},tumor:{loc:'lfront',R:0}};
const DKN = META.dk_names;               // 'L_bankssts'...
const dkBase = i => DKN[i].slice(2);
const dkSide = i => DKN[i][0];
const GLN = META.gl_names;               // índice 0..359 -> 'L_V1'
const glCode = g => GLN[g-1].slice(2);
const sideEs = s => s==='L'?'izquierdo':'derecho';
const fmtD = d => (d>0?'+':d<0?'−':'')+Math.abs(d).toFixed(2).replace('.',',');
function hexRGB(h){const n=parseInt(h.slice(1),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function hsl(h,s,l){const k=n=>(n+h*12)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return [f(0),f(8),f(4)];}
const NEG=hexRGB('#4f7fd9'), POS=hexRGB('#e0604f'), NEU=hexRGB('#c9c4ba'), SIMBASE=hexRGB('#bdb6aa'), INF=hexRGB('#6e1f2b'), EDEMA=hexRGB('#d9c46a');
function divColor(d){ if(d==null) return [0.42,0.44,0.46]; const t=Math.max(-1,Math.min(1,d/0.6)); return t<0?mix(NEU,NEG,-t):mix(NEU,POS,t); }
const DEEPKEY = k => k.replace(/^[LR]/,'').replace(/^dent[LR]$/,'dent');
const sideOfKey = k => k==='dentL'?'L':k==='dentR'?'R':(/^[LR][a-z]/.test(k)?k[0]:null);
const trBase = n => n.replace(/_[LR]$/,'');
const trSide = n => /_L$/.test(n)?'L':/_R$/.test(n)?'R':null;
const SUBKEY = {thal:'thal',caud:'caud',put:'put',pal:'pal',hippo:'hippo',amyg:'amyg',accumb:'accumb',vent:'LatVent'};

/* region colors per DK index */
const dkColor=[];
{ const byLobe={}; DKN.forEach((n,i)=>{const b=n.slice(2); const lb=DK[b]?DK[b].lobe:'frontal'; (byLobe[lb]=byLobe[lb]||[]).push(i);});
  for(const lb in byLobe){ const base=hexRGB(LOBES[lb].color); const arr=byLobe[lb].filter(i=>dkSide(i)==='L');
    arr.forEach((i,k)=>{ const t=arr.length>1?k/(arr.length-1):0.5; const c=mix(mix(base,[1,1,1],0.18),mix(base,[0.15,0.15,0.18],0.35),t); dkColor[i]=c; dkColor[DKN.indexOf('R_'+dkBase(i))]=c; }); } }
const glColor=g=>{ const host=META.gl_host[g]; const base=host!=null?hexRGB(LOBES[lobeOfDK(host)].color):[0.5,0.5,0.5]; const t=(((g%180)+1)*0.618034)%1; const c=t<0.5?mix(base,[1,1,1],(0.5-t)*0.85):mix(base,[0.12,0.13,0.16],(t-0.5)*0.95); return mix(c,hsl(t,0.5,0.55),0.18); };

/* ============ panel ============ */
const isSurf = s => s && (s.kind==='dk'||s.kind==='gl'||s.kind==='lobe');
function selTest(o,s){ if(s.kind==='dk') return i=>o.dk[i]===s.id; if(s.kind==='gl') return i=>o.gl[i]===s.id; if(s.kind==='lobe') return i=>o.h===s.h&&o.dk[i]!==255&&lobeOfDK(o.dk[i])===s.id; return ()=>false; }
function lobeOfDK(i){const d=DK[dkBase(i)]; return d?d.lobe:'frontal';}
function enigmaRows(subkey, isCtx){
  const rows=[];
  for(const k in META.disorders){ const D=META.disorders[k]; const v=isCtx?D.ctx[subkey]:D.sub[subkey]; if(v) rows.push([k,D.name,v[0],v[1]]); }
  rows.sort((a,b)=>Math.abs(b[2])-Math.abs(a[2])); return rows;
}
function barRow(label,d,go,p){
  const w=Math.min(50,Math.abs(d)/0.8*50), col=d<0?'var(--neg)':'var(--pos)';
  const st=d<0?`right:50%;width:${w}%`:`left:50%;width:${w}%`;
  return `<button class="drow" ${go?`data-go="${go}"`:''}><span class="nm">${label}</span><span class="trk"><span class="fill" style="${st};background:${col}"></span></span><span class="v">${fmtD(d)}${p!=null&&p<0.05?'':'<sup>ns</sup>'}</span></button>`;
}
function enigmaBlock(subkey,isCtx){
  const rows=enigmaRows(subkey,isCtx); if(!rows.length) return '';
  return `<h3>Hallazgos ENIGMA en esta estructura</h3><p style="font-size:12.5px;color:var(--muted)">Diferencia media casos − controles (d de Cohen). Azul: menor grosor o volumen; rojo: mayor. <sup>ns</sup> = no significativo tras corrección.</p><div class="dbars">${rows.map(r=>barRow(r[1],r[2],'dis:'+r[0],r[3])).join('')}</div>`;
}
function renderIndex(){
  let h=`<p class="kicker">Sistema nervioso central</p><h2>Encéfalo</h2><p class="sub2">Encephalon</p>
  <p class="lede">Superficie cortical real de un cerebro promedio (fsaverage, FreeSurfer) parcelada en 68 regiones de Desikan-Killiany o en las 360 áreas del atlas multimodal HCP-MMP1, con núcleos y ventrículos (CerebrA, CIT168), tronco, cerebelo, 75 tractos de sustancia blanca (HCP-842) y los grandes sistemas de neurotransmisores. Toca una región o elige una aquí.</p>`;
  for(const lb of ['frontal','parietal','temporal','occipital','limbic','insula']){
    const regs=Object.keys(DK).filter(k=>DK[k].lobe===lb);
    h+=`<div class="grp"><h3><span class="sw" style="background:${LOBES[lb].color}"></span><button class="lnk" style="font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit" data-go="lobe:${lb}:lh">${LOBES[lb].name}</button></h3><div class="list">${regs.map(k=>`<button data-go="dk:${DKN.indexOf('L_'+k)}">${DK[k].es}<small>${DK[k].ba}</small></button>`).join('')}</div></div>`;
  }
  h+=`<div class="grp"><h3>Ganglios basales y sistema límbico</h3><div class="list">${['caud','put','pal','accumb','stn','hippo','amyg','bf'].map(k=>`<button data-go="deep:L${k}">${DEEP[k].es}</button>`).join('')}</div></div>`;
  h+=`<div class="grp"><h3>Diencéfalo y mesencéfalo</h3><div class="list">${['thal','hth','mam','hab','snc','snr','vta','rn'].map(k=>`<button data-go="deep:L${k}">${DEEP[k].es}</button>`).join('')}<button data-go="deep:chiasm">${DEEP.chiasm.es}</button></div></div>`;
  h+=`<div class="grp"><h3>Tronco y ventrículos</h3><div class="list">${[0,1,2].map(i=>`<button data-go="stem:${i}">${DEEP['stem'+i].es}</button>`).join('')}<button data-go="deep:Lvent">${DEEP.vent.es}</button><button data-go="deep:v3">${DEEP.v3.es}</button><button data-go="deep:v4">${DEEP.v4.es}</button></div></div>`;
  { const seen=new Set(), btn=[]; META.tracts.forEach((n,i)=>{ const b=trBase(n); if(seen.has(b)||!TRACT[b]) return; seen.add(b); const li=META.tracts.indexOf(b+'_L'); btn.push([TRACT[b].cls,`<button data-go="tr:${li>=0?li:i}">${TRACT[b].es}</button>`]); });
    h+=`<div class="grp"><h3>Sustancia blanca · tractos</h3><div class="list">${btn.sort((a,b)=>Object.keys(TRCLS).indexOf(a[0])-Object.keys(TRCLS).indexOf(b[0])).map(x=>x[1]).join('')}</div></div>`; }
  h+=`<div class="grp"><h3>Sistemas de neurotransmisores</h3><div class="list">${Object.keys(NT).map(k=>`<button data-go="nt:${k}">${NT[k].es}</button>`).join('')}</div></div>`;
  h+=`<div class="grp"><h3>Cerebelo</h3><div class="list">${Object.keys(CB).map(k=>`<button data-go="cb:${k}">${CB[k].es}</button>`).join('')}<button data-go="deep:dentL">Núcleo dentado</button></div></div>`;

async function loadBuffer(){

  let u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    if('DecompressionStream' in window){ const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); u8=new Uint8Array(await new Response(s).arrayBuffer()); }
    else { await new Promise((res,rej)=>{const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);}); u8=window.pako.ungzip(u8); }
  }
  return u8.buffer.slice(u8.byteOffset,u8.byteOffset+u8.byteLength);
}

});

  if(single&&!was&&drag){ const h=pick(e.clientX,e.clientY); if(h){ if(S.mode==='sim') setMode('anat'); select(h);} } if(!ptrs.size) drag=null; });
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); drag=null;});
cv.addEventListener('pointerleave',()=>{$('#tip').hidden=true; S.hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault(); idle=false; camT.dist=Math.max(220,Math.min(1000,camT.dist*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});

function resize(){const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();

/* ============ bucle ============ */
function orientName(){ const p=cam.pitch; if(p>0.95) return 'superior'; if(p<-0.95) return 'inferior';
  const y=Math.atan2(Math.sin(cam.yaw),Math.cos(cam.yaw)), a=Math.abs(y), side=y<0?'izquierda':'derecha';
  if(S.hemi!=='both'&&a>0.6&&a<2.5){ const facing=y<0?'lh':'rh'; return (facing===S.hemi?'lateral ':'medial ')+(S.hemi==='lh'?'izquierda':'derecha'); }
  if(a<0.35) return 'anterior'; if(a>2.8) return 'posterior'; if(a<1.2) return 'anterolateral '+side; if(a<1.95) return 'lateral '+side; return 'posterolateral '+side; }
const tmp=new THREE.Vector3(), clock=new THREE.Clock(); let lastName='';
const tag=$('#tag');
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), k=1-Math.pow(0.002,dt);
  if(idle) camT.yaw+=dt*0.1;
  let dy=camT.yaw-cam.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); cam.yaw+=dy*k; cam.pitch+=(camT.pitch-cam.pitch)*k; cam.dist+=(camT.dist-cam.dist)*k;
  camera.position.set(cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw), cam.dist*Math.sin(cam.pitch), cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw)); camera.lookAt(0,0,0);
  const targets=selTargets();
  for(const o of objs){
    let vis=o.layer==='ctx'?(S.hemi==='both'||S.hemi===o.h):S.layers[o.layer];
    if(o.layer==='deep'||o.layer==='vent'){ if(S.hemi!=='both'&&o.side&&((o.side<0)!==(S.hemi==='lh'))) vis=false; }
    o.mesh.visible=vis;
    if(o.cen){ let tsc=1; if(COND&&S.mode==='path'){ const b=o.key.replace(/^[LR]/,''); if(COND.shrink[b]) tsc=COND.shrink[b]; if(o.layer==='vent') tsc=COND.vent; } o.sc+=(tsc-o.sc)*k; o.mesh.scale.setScalar(o.sc); }
    const pop=targets.includes(o)&&o.kind==='deep'?6:0;
    tmp.copy(o.dir).multiplyScalar(o.mag*S.explode+pop); o.off.lerp(tmp,k); o.mesh.position.copy(o.off); if(o.cen&&o.sc!==1) o.mesh.position.addScaledVector(o.cen,1-o.sc);
    let op=o.layer==='ctx'?S.ghost:1;
    if(targets.length&&!targets.includes(o)) op=o.layer==='ctx'?Math.min(op,0.12):0.25;
    if(o.layer==='ctx'&&S.mode==='sim'&&S.tumor.R>0.5) op=Math.min(op,0.55);
    if(o===TRO&&S.sel&&S.sel.kind==='tr') op=0.1;
    if(o===TRO&&S.nt) op=0.15;
    if(S.nt&&o.layer!=='ctx'&&o!==TRO) op=Math.min(op,0.4);
    o.op+=(op-o.op)*k; const m=o.mesh.material;
    if(o.layer==='ctx'){ const sd=o.op<0.97?THREE.FrontSide:THREE.DoubleSide; if(m.side!==sd){ m.side=sd; m.needsUpdate=true; } } m.opacity=o.op; m.depthWrite=o.layer==='ctx'?true:o.op>0.6; o.mesh.renderOrder=o.op>0.6?0:2;
    m.emissive.setRGB(0,0,0); if(targets.includes(o)&&o!==TRO) m.emissive.setRGB(0.12,0.12,0.12);
    if(S.hover&&!S.sel&&((S.hover.kind==='deep'&&o.key===S.hover.key))) m.emissive.setRGB(0.08,0.08,0.08);
  }
  if(ovState.h){ const o=CTX[ovState.h]; ovState.amt+=(ovState.target-ovState.amt)*k; overlay.position.copy(o.off).addScaledVector(ovState.dir,ovState.amt); overlay.visible=o.mesh.visible; }
  trHL.visible=trHL.visible&&TRO.mesh.visible&&!!(S.sel&&S.sel.kind==='tr');
  if(ntFlows.length) tickNT(clock.elapsedTime);
  renderer.render(scene,camera);
  // etiqueta
  if(S.sel){ let w=null; const s=S.sel;
    if(isSurf(s)){ const o=CTX[ovState.h]; const p=o.mesh.geometry.attributes.position.array; let bi=-1,bd=-1e9; const test=selTest(o,s);
      for(let i=0;i<o.dk.length;i+=3) if(test(i)){ tmp.set(p[i*3],p[i*3+1],p[i*3+2]); const d=tmp.dot(ovState.dir); if(d>bd){bd=d;bi=i;} }
      if(bi>=0){ w=new THREE.Vector3(p[bi*3],p[bi*3+1],p[bi*3+2]).add(overlay.position); } }
    else { const o=targets[0]; if(o&&o.mesh.visible){ o.mesh.geometry.computeBoundingSphere(); w=o.mesh.geometry.boundingSphere.center.clone().add(o.mesh.position); } }
    if(w){ root.localToWorld(w); w.project(camera); const rc=stage.getBoundingClientRect(); const x=(w.x*0.5+0.5)*rc.width, y=(-w.y*0.5+0.5)*rc.height;
      if(w.z<1){ tag.hidden=false; const nm=nameOf(s).split('  ')[0]; tag.innerHTML=nm.replace(' · ',' <small>')+(nm.includes(' · ')?'</small>':''); tag.style.transform=`translate(${Math.max(4,Math.min(x+8,rc.width-240))}px,${y-10}px)`; } else tag.hidden=true;
    } else tag.hidden=true; } else tag.hidden=true;
  const n=orientName(); if(n!==lastName){$('#viewName').textContent=n; lastName=n;}
  requestAnimationFrame(frame);
}
rebuildCtx(); recolor(); $('#loading').remove(); requestAnimationFrame(frame);
}
