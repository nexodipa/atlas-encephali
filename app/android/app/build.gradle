plugins { id 'com.android.application' }
android {
    namespace 'org.nexodipa.atlasencephali'
    compileSdk 34
    defaultConfig {
        applicationId 'org.nexodipa.atlasencephali'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE') ?: '17') as int
        versionName (System.getenv('VERSION_NAME') ?: '17')
    }
    buildTypes {
        release {
            minifyEnabled false
            // firmado con la clave de depuración del compilador: sirve para instalar fuera de Google Play
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html', 'webmanifest' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
